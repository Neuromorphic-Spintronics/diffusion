name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check diffusionsde tests

      - name: Check formatting
        run: uv run ruff format --check diffusionsde tests

      - name: Type check
        run: uv run ty check

      - name: Build and import wheel
        shell: bash
        run: |
          uv build
          python_bin="$(pwd)/.venv/bin/python"
          wheel="$(find "$(pwd)/dist" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python "$python_bin" --force-reinstall --no-deps "$wheel"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          (
            cd "$smoke_dir"
            "$python_bin" -c "import diffusionsde; print(diffusionsde.__file__)"
          )

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --dev

      - name: Run non-slow tests
        run: uv run python -m pytest -m "not slow" -q

  gate:
    name: Required CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, tests]
    steps:
      - name: Confirm all checks passed
        run: echo "All CI checks passed."
